# KPS Rust workspace: the `kps` library plus the interop CLIs.
[workspace]
resolver = "2"
members = ["kps", "kps-server", "kps-dial"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/privacy-ethereum/kps"

[workspace.dependencies]
kps = { path = "kps" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
anyhow = "1"

# webrtc-sctp carries a KPS fix (drain the reassembly queue before honoring
# read_shutdown) pending upstream: without it, a peer that writes and promptly
# closes a data channel loses data at a webrtc-rs receiver ~10% of the time.
# The patched source lives on the orphan branch `vendor/webrtc-sctp` of this
# repo — verbatim crates.io 0.13.0 plus one commit (grep "KPS PATCH") — pinned
# by rev so builds don't float with the branch.
# Upstream: https://github.com/webrtc-rs/webrtc/issues/816
# Vendored dependency patches, each an orphan branch of this repo holding a
# verbatim crates.io copy plus fix commit(s) (grep "KPS PATCH"). Upstream
# issues:
# - webrtc-sctp: read-shutdown drain (webrtc-rs/webrtc#816) + permanent
#   zero-window deadlock on tail-of-burst loss (webrtc-rs/webrtc#822).
# - webrtc: two KPS-patch commits. (1) negotiated-channel accept race — early
#   inbound message on a negotiated stream parsed as DCEP, killing the accept
#   loop (webrtc-rs/webrtc#821). (2) a regression from (1), NOT an upstream bug:
#   the id-reuse claim matched stale CLOSED channels (never pruned from
#   data_channels), so a browser's reused SCTP stream id was swallowed — read
#   hangs after ~2 streams (kps#4). Fixed by gating the claim on ReadyState::Open.
[patch.crates-io]
webrtc-sctp = { git = "https://github.com/privacy-ethereum/kps.git", rev = "a73a0a8f9e4f76f3b89ba1155562ec836bcf3f3b" }
webrtc = { git = "https://github.com/privacy-ethereum/kps.git", rev = "4982e1c1cdce3baa3f703a746367a5e53ca64928" }
