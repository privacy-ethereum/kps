# KPS Rust workspace: the `kps` library plus the interop CLIs.
[workspace]
resolver = "2"
members = ["kps", "kps-server", "kps-dial"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/privacy-ethereum/kps"

[workspace.dependencies]
kps = { path = "kps" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
anyhow = "1"
