name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go (lib + interop matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build + vet + test (libs/go)
        working-directory: libs/go
        # The QUIC interop tests dial a real QUIC client, which needs real UDP
        # socket access (DF-bit / GSO / ECN socket options). A CI runner provides
        # this; do not run these under a restrictive seccomp sandbox.
        run: |
          go build ./...
          go vet ./...
          go test -timeout 120s ./...
      - name: Build demo server
        working-directory: demos/chat/server-go
        run: go build ./...

  rust:
    name: Rust (lib + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/rust
      - name: Build + test (libs/rust)
        working-directory: libs/rust
        # Same real-UDP requirement as the Go job. The build fetches the
        # patched webrtc-sctp from this repo's vendor/webrtc-sctp branch
        # ([patch.crates-io] in libs/rust/Cargo.toml).
        run: |
          cargo build --workspace
          cargo test --workspace

  js:
    name: JS (build + unit + integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The integration suite (test:integration) drives the QUIC client/server
      # and shells out to the Go and Rust libs (servers + dial clients) for
      # cross-impl coverage, so all three toolchains are needed here.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/rust
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build @kpstreams packages
        working-directory: libs/js
        run: |
          npm install
          npm run build
      - name: Unit tests (core)
        working-directory: libs/js
        run: npm test
      - name: Integration tests (QUIC + cross-impl matrix)
        working-directory: libs/js
        # Dials real QUIC/WebRTC clients: needs real UDP socket access (DF-bit /
        # GSO / ECN); do not run under a restrictive seccomp sandbox.
        run: npm run test:integration

  interop:
    name: Interop (browser WebRTC ↔ Go/JS/Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/rust
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test deps
        working-directory: tests/interop
        run: npm install
      - name: Install Playwright Chromium
        working-directory: tests/interop
        run: npx playwright install --with-deps chromium
      - name: Run interop test
        working-directory: tests/interop
        run: npm test
