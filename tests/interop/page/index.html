<!doctype html>
<html>
<head>
  <meta charset="utf-8"><title>kps echo test</title>
  <!-- Resolve the bare package specifiers to the dist trees the static server
       exposes (see global-setup.js STATIC_ROUTES). Avoids a bundler. -->
  <script type="importmap">
  {
    "imports": {
      "@kpstreams/core": "/kps/core/index.js",
      "@kpstreams/core/webrtc": "/kps/core/webrtc.js",
      "@kpstreams/webrtc-client": "/kps/webrtc-client/index.js"
    }
  }
  </script>
</head>
<body>
  <pre id="status">idle</pre>
  <pre id="result"></pre>
  <script type="module">
    import { dial } from '@kpstreams/webrtc-client'

    const statusEl = document.getElementById('status')
    const resultEl = document.getElementById('result')
    const setStatus = s => { statusEl.textContent = s }

    window.runEcho = async function (addr) {
      setStatus('dialing')
      const conn = await dial(addr)
      setStatus('connected')
      const stream = await conn.openStream()
      setStatus('stream-open')

      const text = `hello-${Date.now()}`

      // Write the bytes and finish our write half so the echo server's io.Copy
      // sees EOF, mirrors the bytes back, and then closes its own write half.
      const writer = stream.writable.getWriter()
      await writer.write(new TextEncoder().encode(text))
      await writer.close()

      // Read echoed bytes until the server closes its write half (EOF).
      const reader = stream.readable.getReader()
      const chunks = []
      for (;;) {
        const { value, done } = await reader.read()
        if (done) break
        if (value) chunks.push(value)
      }
      const total = chunks.reduce((n, c) => n + c.length, 0)
      const merged = new Uint8Array(total)
      let off = 0
      for (const c of chunks) { merged.set(c, off); off += c.length }
      const echoed = new TextDecoder().decode(merged)
      resultEl.textContent = echoed
      setStatus('done')

      await conn.close()
      return echoed === text
    }

    // Large-payload echo: 1.5 MiB crosses the 1 MiB per-stream window (SPEC
    // §6.5), so this only completes if MAX_STREAM_DATA / MAX_DATA credit is
    // advertised and honored through a real RTCPeerConnection. Write and read
    // run concurrently — a write-all-then-read would deadlock at the window.
    window.runLargeEcho = async function (addr) {
      setStatus('dialing')
      const conn = await dial(addr)
      setStatus('connected')
      const stream = await conn.openStream()
      setStatus('stream-open')

      const SIZE = 1536 * 1024
      const sent = new Uint8Array(SIZE)
      for (let i = 0; i < SIZE; i++) sent[i] = (i * 2654435761) & 0xff // deterministic

      const writeDone = (async () => {
        const writer = stream.writable.getWriter()
        const CHUNK = 64 * 1024
        for (let off = 0; off < SIZE; off += CHUNK) {
          await writer.write(sent.subarray(off, Math.min(off + CHUNK, SIZE)))
        }
        await writer.close()
      })()

      const reader = stream.readable.getReader()
      const got = new Uint8Array(SIZE)
      let n = 0
      for (;;) {
        const { value, done } = await reader.read()
        if (done) break
        if (value) { got.set(value.subarray(0, Math.min(value.length, SIZE - n)), n); n += value.length }
      }
      await writeDone
      setStatus('done')
      await conn.close()

      if (n !== SIZE) return false
      for (let i = 0; i < SIZE; i++) if (got[i] !== sent[i]) return false
      return true
    }

    // Sustained cycling: open N streams sequentially on ONE dial(), each fully
    // closed before the next. Every close resets and frees its SCTP stream id,
    // so the next openStream reuses the lowest free id (2, 4, 2, ...) — the
    // browser-specific id-reuse that headless Go/Rust clients don't exercise
    // (they allocate ids monotonically). Returns the count that completed; a
    // server that routes a reused id to a stale closed DataChannel (kps#4) makes
    // a read hang, so a per-stream guard bounds it and reports where it stalled.
    window.runManyStreams = async function (addr, n) {
      setStatus('dialing')
      const conn = await dial(addr)
      setStatus('connected')
      const enc = new TextEncoder()
      const dec = new TextDecoder()
      let completed = 0
      try {
        for (let i = 0; i < n; i++) {
          const stream = await conn.openStream()
          const text = `stream-${i}`

          const writer = stream.writable.getWriter()
          await writer.write(enc.encode(text))
          await writer.close()

          const reader = stream.readable.getReader()
          const chunks = []
          const drain = (async () => {
            for (;;) {
              const { value, done } = await reader.read()
              if (done) break
              if (value) chunks.push(value)
            }
          })()
          let timer
          const guard = new Promise((_, reject) => {
            timer = setTimeout(() => reject(new Error(`read timed out on stream ${i}`)), 5000)
          })
          await Promise.race([drain, guard])
          clearTimeout(timer)

          const total = chunks.reduce((a, c) => a + c.length, 0)
          const merged = new Uint8Array(total)
          let off = 0
          for (const c of chunks) { merged.set(c, off); off += c.length }
          if (dec.decode(merged) !== text) throw new Error(`echo mismatch on stream ${i}`)

          await stream.close()
          completed = i + 1
          setStatus(`ok ${completed}/${n}`)
        }
        await conn.close()
      } catch (e) {
        resultEl.textContent = `stalled after ${completed}/${n}: ${e && e.message}`
        try { await conn.close() } catch { /* ignore */ }
      }
      return completed
    }
  </script>
</body>
</html>
